name: SoundPath
options:
  bundleIdPrefix: com.soundpath
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    DEVELOPMENT_TEAM: ""
targets:
  SoundPath:
    type: application
    platform: macOS
    sources:
      - path: SoundPath
    info:
      path: SoundPath/Info.plist
      properties:
        CFBundleDisplayName: SoundPath
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        NSMicrophoneUsageDescription: "SoundPath shows the live input level of your microphone in the Audio Devices window."
        NSAudioCaptureUsageDescription: "SoundPath needs to capture app audio to control per-app volume and effects."
        NSHumanReadableCopyright: "© 2026 SoundPath"
        CFBundleAllowMixedLocalizations: true
    entitlements:
      path: SoundPath/SoundPath.entitlements
      properties:
        com.apple.security.app-sandbox: false
        com.apple.security.device.audio-input: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundpath.SoundPath
        PRODUCT_NAME: SoundPath
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_OPTIMIZATION_LEVEL_Release: -O
        OTHER_SWIFT_FLAGS: ""
  SoundPathTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SoundPathTests
    dependencies:
      - target: SoundPath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.soundpath.SoundPathTests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/SoundPath.app/Contents/MacOS/SoundPath"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_IDENTITY: "-"
schemes:
  SoundPath:
    build:
      targets:
        SoundPath: all
        SoundPathTests: [test]
    test:
      targets:
        - SoundPathTests
